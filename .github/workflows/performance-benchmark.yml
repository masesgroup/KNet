name: KNet Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      Repeat:
        description: 'Number of test repetitions per combination'
        required: false
        default: '1'
        type: string
      MinPacketsToExchange:
        description: 'Min packets to exchange'
        required: false
        default: '1000'
        type: string
      MaxPacketsToExchange:
        description: 'Max packets to exchange'
        required: false
        default: '10000'
        type: string
      MinPacketLength:
        description: 'Min packet length (bytes)'
        required: false
        default: '100'
        type: string
      MaxPacketLength:
        description: 'Max packet length (bytes)'
        required: false
        default: '100000'
        type: string
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

env:
  BENCH_REPEAT:  ${{ inputs.Repeat               || '1'      }}
  BENCH_MIN_PKT: ${{ inputs.MinPacketsToExchange  || '1000'   }}
  BENCH_MAX_PKT: ${{ inputs.MaxPacketsToExchange  || '10000'  }}
  BENCH_MIN_LEN: ${{ inputs.MinPacketLength       || '100'    }}
  BENCH_MAX_LEN: ${{ inputs.MaxPacketLength       || '100000' }}

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build — Windows runner, identical to build_common.yaml build_windows
  # ────────────────────────────────────────────────────────────────────────────
  build_benchmarks:
    name: Build benchmark projects
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" src\net\KNet\KNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true

      - name: Set up Java and Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create JARs
        run: mvn --file ./src/jvm/knet/pom.xml --no-transfer-progress package

      - name: Compile tests (includes benchmark projects)
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" tests\net\KNetTest.sln
        env:
          GITHUB_TEST_PREPARATION: true

      - name: Prepare configuration files
        run: |
          Copy-Item .github\workflows\support\* -Destination bin\net8.0\  -Force
          Copy-Item .github\workflows\support\* -Destination bin\net9.0\  -Force
          Copy-Item .github\workflows\support\* -Destination bin\net10.0\ -Force

      - name: Cache bin net8.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net8.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net8.0_${{ github.sha }}

      - name: Cache bin net9.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net9.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net9.0_${{ github.sha }}

      - name: Cache bin net10.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net10.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net10.0_${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Docker image — identical to build_common.yaml build_container_knet
  # ────────────────────────────────────────────────────────────────────────────
  build_container_knet:
    runs-on: ubuntu-latest
    outputs:
      GITHUB_REF_NAME_FOR_DOCKER: ${{ env.GITHUB_REF_NAME_FOR_DOCKER }}
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" src/net/KNet/KNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create Jars
        run: mvn --file ./src/jvm/knet/pom.xml --no-transfer-progress package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/knet

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          file: ./src/container/DockerfileKNet.linux
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest GitHub
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/knet
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Extract branch name
        run: echo "GITHUB_REF_NAME_FOR_DOCKER=$(echo ${{ github.ref_name }} | tr '/' '-')" >> $GITHUB_ENV
        shell: bash

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Run benchmarks — matrix on framework, one Kafka service per leg
  # ────────────────────────────────────────────────────────────────────────────
  run_benchmarks:
    name: Benchmark (${{ matrix.framework }})
    needs: [build_benchmarks, build_container_knet]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false        # let all legs finish even if one fails
      matrix:
        framework: ['net8.0', 'net9.0', 'net10.0']

    services:
      kafka:
        image: ghcr.io/${{ github.repository_owner }}/knet:${{ needs.build_container_knet.outputs.GITHUB_REF_NAME_FOR_DOCKER }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 9092:9092
        env:
          KNET_DOCKER_RUNNING_MODE: server-standalone
          JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}

    env:
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}
      RESULTS_DIR: ${{ github.workspace }}/benchmark-results

    steps:
      # ── .NET SDK for this matrix leg (mirrors build_common.yaml pattern) ───
      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net8.0'
        with:
          dotnet-version: 8.x

      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net9.0'
        with:
          dotnet-version: 9.x

      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net10.0'
        with:
          dotnet-version: 10.x

      # ── Restore compiled binaries from build_benchmarks ───────────────────
      - name: Restore bin ${{ matrix.framework }} from cache
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/${{ matrix.framework }}/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_${{ matrix.framework }}_${{ github.sha }}

      - name: Create results directory
        run: mkdir -p "$RESULTS_DIR"

      # ── Robust Kafka readiness check ──────────────────────────────────────
      # nc -z only confirms TCP port is open; the broker resets the connection
      # immediately while still initialising (APIVERSION_QUERY state).
      # This script sends a minimal ApiVersions v0 Kafka request and waits
      # until the broker replies before handing off to the benchmarks.
      - name: Wait for Kafka broker (ApiVersions handshake)
        run: |
          python3 - <<'PYEOF'
          import socket, struct, sys, time

          HOST, PORT, ATTEMPTS, DELAY = 'localhost', 9092, 40, 5

          # Minimal valid ApiVersions v0 request (Kafka wire protocol)
          client_id = b'readycheck'
          payload = (
              struct.pack('>hhi', 18, 0, 1) +           # ApiKey=18, ApiVersion=0, CorrelationId=1
              struct.pack('>h', len(client_id)) + client_id
          )
          request = struct.pack('>i', len(payload)) + payload

          for attempt in range(1, ATTEMPTS + 1):
              try:
                  s = socket.create_connection((HOST, PORT), timeout=5)
                  s.sendall(request)
                  # Any 4-byte response header means the broker accepted the handshake
                  header = s.recv(4)
                  s.close()
                  if len(header) == 4:
                      print(f'Kafka broker ready (attempt {attempt})')
                      sys.exit(0)
              except Exception as exc:
                  print(f'Attempt {attempt}/{ATTEMPTS}: {exc}')
              time.sleep(DELAY)

          print('ERROR: Kafka broker not ready after timeout')
          sys.exit(1)
          PYEOF

      # ── Produce/Consume benchmark ─────────────────────────────────────────
      - name: Run KNetBenchmark (Produce/Consume) [${{ matrix.framework }}]
        timeout-minutes: 60
        run: |
          dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetBenchmark.dll"           \
            -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml"  \
            -Server               localhost:9092                                                   \
            -ResultsPath          "$RESULTS_DIR"                                                   \
            -ShowFinalResults                                                                      \
            -ShowIntermediateResults                                                               \
            -Repeat               ${{ env.BENCH_REPEAT }}                                          \
            -MinPacketsToExchange ${{ env.BENCH_MIN_PKT }}                                         \
            -MaxPacketsToExchange ${{ env.BENCH_MAX_PKT }}                                         \
            -MinPacketLength      ${{ env.BENCH_MIN_LEN }}                                         \
            -MaxPacketLength      ${{ env.BENCH_MAX_LEN }}                                         \
            -UseKNetProducer                                                                       \
            -UseKNetConsumer

      # ── Roundtrip benchmark ───────────────────────────────────────────────
      # Note: -NoAcks is intentionally omitted — round-trip latency measurement
      # requires reliable delivery; acks=0 can silently drop messages and cause
      # the consumer thread to never reach numpacket.
      - name: Run KNetRoundTripBenchmark [${{ matrix.framework }}]
        timeout-minutes: 60
        run: |
          dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetRoundTripBenchmark.dll"  \
            -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml"  \
            -Server               localhost:9092                                                   \
            -ResultsPath          "$RESULTS_DIR"                                                   \
            -ShowFinalResults                                                                      \
            -ShowIntermediateResults                                                               \
            -Repeat               ${{ env.BENCH_REPEAT }}                                          \
            -MinPacketsToExchange ${{ env.BENCH_MIN_PKT }}                                         \
            -MaxPacketsToExchange ${{ env.BENCH_MAX_PKT }}                                         \
            -MinPacketLength      ${{ env.BENCH_MIN_LEN }}                                         \
            -MaxPacketLength      ${{ env.BENCH_MAX_LEN }}                                         \
            -FetchMinBytes 1                                                                       \
            -UseKNetProducer                                                                       \
            -UseKNetConsumer

      # ── Upload CSVs — artifact name includes framework to avoid collisions ─
      # Artifacts are kept as separate per-framework directories so the
      # update_docs job can extract the framework name from the path.
      - name: Upload raw benchmark results [${{ matrix.framework }}]
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-csv-${{ github.run_number }}-${{ matrix.framework }}
          path: ${{ env.RESULTS_DIR }}/**
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Parse CSVs from ALL matrix legs → update performance.md → open PR
  # ────────────────────────────────────────────────────────────────────────────
  update_docs:
    name: Update performance.md and open PR
    needs: run_benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      # Download all per-framework artifacts preserving directory structure.
      # Without merge-multiple the layout is:
      #   ./benchmark-results/benchmark-csv-<run>-net8.0/results_*.csv
      #   ./benchmark-results/benchmark-csv-<run>-net9.0/results_*.csv
      #   ./benchmark-results/benchmark-csv-<run>-net10.0/results_*.csv
      # The framework name is extracted from the directory name in the Python script.
      - name: Download all benchmark CSV results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-csv-${{ github.run_number }}-*
          path: ./benchmark-results

      - name: List downloaded CSVs (debug)
        run: find ./benchmark-results -name '*.csv' | sort

      # ── Python: parse CSVs, compute ratios, patch the doc ─────────────────
      - name: Parse results and update performance.md
        env:
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import csv, glob, math, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          RESULTS_DIR = "./benchmark-results"
          DOCS_PATH   = "src/documentation/articles/performance.md"
          RUN_ID      = os.environ.get("GITHUB_RUN_ID", "")
          RUN_NUM     = os.environ.get("GITHUB_RUN_NUMBER", "?")
          SHA_SHORT   = os.environ.get("GITHUB_SHA", "")[:7]
          REPO        = os.environ.get("GITHUB_REPOSITORY", "")
          NOW         = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # ── stats ──────────────────────────────────────────────────────────
          def mean(lst):
              return sum(lst) / len(lst) if lst else 0.0

          def sd(lst):
              if len(lst) < 2:
                  return 0.0
              m = mean(lst)
              return math.sqrt(sum((x - m) ** 2 for x in lst) / (len(lst) - 1))

          def ratio_str(a, b):
              try:
                  return f"{a / b * 100:.2f}".replace(".", ",")
              except ZeroDivisionError:
                  return "N/A"

          def bold_if_knet_better(cell):
              try:
                  v = float(cell.split(" ")[0].replace(",", "."))
                  return f"**{cell}**" if v < 100 else cell
              except (ValueError, IndexError):
                  return cell

          # ── framework detection ────────────────────────────────────────────
          # Artifact dirs are named benchmark-csv-<run>-<framework>, e.g.
          # ./benchmark-results/benchmark-csv-42-net9.0/results_*.csv
          def framework_from_path(path):
              m = re.search(r'benchmark-csv-\d+-([\w.]+)[/\\]', path)
              return m.group(1) if m else "unknown"

          # ── CSV parsing ────────────────────────────────────────────────────
          def read_csv(path):
              with open(path, newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f, delimiter=";"))

          def aggregate_bench(csv_files):
              """
              CSV header (Program.cs):
                NumPackets;Length;KNETProd;KNETCons;ConfluentProd;ConfluentCons

              Key: (framework, packets, length)
              Produce and consume metrics are stored independently so that a
              timeout on one side does not suppress the other in the table.
              """
              agg = {}
              total_rows = 0
              for path in csv_files:
                  fw = framework_from_path(path)
                  for row in read_csv(path):
                      try:
                          pkt = int(row["NumPackets"])
                          lng = int(row["Length"])
                          kp  = float(row["KNETProd"]      or 0)
                          cp  = float(row["ConfluentProd"] or 0)
                          kc  = float(row["KNETCons"]      or 0)
                          cc  = float(row["ConfluentCons"] or 0)
                          # Skip rows with no useful data at all
                          if kp == 0 and cp == 0 and kc == 0 and cc == 0:
                              print(f"  SKIP (all zeros): {path} fw={fw} pkt={pkt} len={lng}")
                              continue
                          key = (fw, pkt, lng)
                          d = agg.setdefault(key, {"kp": [], "cp": [], "kc": [], "cc": []})
                          # Append only non-zero values so N/A is shown when a
                          # metric is missing rather than skewing the average.
                          if kp > 0: d["kp"].append(kp)
                          if cp > 0: d["cp"].append(cp)
                          if kc > 0: d["kc"].append(kc)
                          if cc > 0: d["cc"].append(cc)
                          total_rows += 1
                      except (KeyError, ValueError) as e:
                          print(f"  PARSE ERROR {path}: {e} | row={row}")
              print(f"aggregate_bench: {total_rows} valid rows from {len(csv_files)} file(s)")
              return agg

          def aggregate_roundtrip(csv_files):
              """
              CSV header (KNetRoundTripBenchmark/Program.cs):
                NumPackets;Length;KNETMax;KNETMin;KNETMean;ConfluentMax;ConfluentMin;ConfluentMean

              Key: (framework, packets, length)
              """
              agg = {}
              total_rows = 0
              for path in csv_files:
                  fw = framework_from_path(path)
                  for row in read_csv(path):
                      try:
                          pkt = int(row["NumPackets"])
                          lng = int(row["Length"])
                          km  = float(row["KNETMean"]      or 0)
                          cm  = float(row["ConfluentMean"] or 0)
                          if km == 0 and cm == 0:
                              print(f"  SKIP (all zeros): {path} fw={fw} pkt={pkt} len={lng}")
                              continue
                          key = (fw, pkt, lng)
                          d = agg.setdefault(key, {"km": [], "cm": []})
                          if km > 0: d["km"].append(km)
                          if cm > 0: d["cm"].append(cm)
                          total_rows += 1
                      except (KeyError, ValueError) as e:
                          print(f"  PARSE ERROR {path}: {e} | row={row}")
              print(f"aggregate_roundtrip: {total_rows} valid rows from {len(csv_files)} file(s)")
              return agg

          # ── table builder ──────────────────────────────────────────────────
          # Rows: Framework + Packets   Columns: lengths (derived from data)
          def build_table(agg, k_key, c_key):
              if not agg:
                  return "_No data available._\n"

              frameworks   = sorted({k[0] for k in agg})
              packets_list = sorted({k[1] for k in agg})
              lengths      = sorted({k[2] for k in agg})

              # Header — length values are formatted with thousands separator
              len_headers = " | ".join(f"{l:,} bytes" for l in lengths)
              header  = f"| Framework | Packets | {len_headers} |\n"
              header += "|:---:|:---:| " + " | ".join(":---:" for _ in lengths) + " |\n"

              rows = ""
              for fw in frameworks:
                  for packets in packets_list:
                      cols = []
                      for length in lengths:
                          d  = agg.get((fw, packets, length), {})
                          kl = d.get(k_key, [])
                          cl = d.get(c_key, [])
                          if not kl or not cl:
                              cols.append("N/A")
                              continue
                          cell = (
                              f"{ratio_str(mean(kl), mean(cl))}"
                              f" ({ratio_str(sd(kl), sd(cl))})"
                          )
                          cols.append(bold_if_knet_better(cell))
                      rows += f"| {fw} | {packets:,} | " + " | ".join(cols) + " |\n"

              return header + rows

          # ── load data ──────────────────────────────────────────────────────
          bench_csvs     = sorted(glob.glob(f"{RESULTS_DIR}/**/results_*.csv",          recursive=True))
          roundtrip_csvs = sorted(glob.glob(f"{RESULTS_DIR}/**/roundtrip_results_*.csv", recursive=True))

          print(f"Found {len(bench_csvs)} bench CSV(s)")
          print(f"Found {len(roundtrip_csvs)} roundtrip CSV(s)")

          if not bench_csvs and not roundtrip_csvs:
              print("No CSV files found – skipping doc update.")
              exit(0)

          bench_agg     = aggregate_bench(bench_csvs)
          roundtrip_agg = aggregate_roundtrip(roundtrip_csvs)

          if not bench_agg and not roundtrip_agg:
              print("All CSVs contain only failed rows – skipping doc update.")
              exit(0)

          produce_table   = build_table(bench_agg,     "kp", "cp")
          consume_table   = build_table(bench_agg,     "kc", "cc")
          roundtrip_table = build_table(roundtrip_agg, "km", "cm")

          run_badge = (
              f"\n> Results automatically updated by CI run "
              f"[#{RUN_NUM}](https://github.com/{REPO}/actions/runs/{RUN_ID})"
              f" · commit `{SHA_SHORT}` · {NOW}\n"
          )

          # ── patch performance.md ───────────────────────────────────────────
          doc = Path(DOCS_PATH).read_text(encoding="utf-8")

          def replace_block(doc, start_marker, end_marker, new_table, badge):
              pattern = re.compile(
                  rf"({re.escape(start_marker)})(.*?)({re.escape(end_marker)})",
                  re.DOTALL,
              )
              # Use a lambda to avoid re.sub interpreting backslashes in the
              # replacement string (e.g. table cells containing '\' sequences
              # would be misread as group references and silently corrupt the doc).
              def make_replacement(m):
                  return m.group(1) + "\n\n" + new_table + "\n" + badge + "\n" + m.group(3)
              result, n = pattern.subn(make_replacement, doc)
              if n == 0:
                  print(f"WARNING: marker not found — {start_marker!r}")
              return result

          PRODUCE_MARKER   = "- KNet/Confluent.Kafka™ Produce Average ratio percentage (SD ratio percentage):"
          CONSUME_MARKER   = "- KNet/Confluent.Kafka™ Consume Average ratio percentage (SD ratio percentage):"
          ROUNDTRIP_MARKER = "- KNet/Confluent.Kafka™ Roundtrip Average ratio percentage (SD ratio percentage):"
          SECTION_END      = "#### Analysis"

          doc = replace_block(doc, PRODUCE_MARKER,   SECTION_END, produce_table,   run_badge)
          doc = replace_block(doc, CONSUME_MARKER,   SECTION_END, consume_table,   run_badge)
          doc = replace_block(doc, ROUNDTRIP_MARKER, SECTION_END, roundtrip_table, run_badge)

          Path(DOCS_PATH).write_text(doc, encoding="utf-8")
          print("performance.md updated successfully.")
          PYEOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: perf/benchmark-results-${{ github.run_number }}
          base: master
          commit-message: "perf: update benchmark results [run #${{ github.run_number }}]"
          title: "perf: update benchmark results [run #${{ github.run_number }}]"
          body: |
            ## :bar_chart: Automated benchmark results update

            This PR updates the performance tables in
            `src/documentation/articles/performance.md`
            with the latest benchmark run results.

            | | |
            |---|---|
            | **CI run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Commit** | `${{ github.sha }}` |
            | **Trigger** | `${{ github.event_name }}` |
            | **Frameworks** | `net8.0`, `net9.0`, `net10.0` |
            | **Repetitions** | `${{ env.BENCH_REPEAT }}` |
            | **Packets** | `${{ env.BENCH_MIN_PKT }}` → `${{ env.BENCH_MAX_PKT }}` |
            | **Lengths (bytes)** | `${{ env.BENCH_MIN_LEN }}` → `${{ env.BENCH_MAX_LEN }}` |

            Raw CSV results are attached to the workflow run as artifacts
            (retained 90 days).

            > [!NOTE]
            > Please review the updated tables before merging.
          labels: |
            documentation
            performance
          add-paths: src/documentation/articles/performance.md

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Cleanup — mirrors final_cleanup in build_common.yaml
  # ────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Clear build caches
    needs: [run_benchmarks, update_docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'

      - name: Delete KNetBenchmark caches for this run
        run: |
          gh extension install actions/gh-actions-cache
          KEYS=$(gh actions-cache list \
            --key "KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}" \
            | cut -f 1)
          set +e
          for KEY in $KEYS; do
            gh actions-cache delete "$KEY" --confirm
          done
          echo "Done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}