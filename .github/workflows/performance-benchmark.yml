name: KNet Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      Repeat:
        description: 'Number of test repetitions per combination (schedule uses 20)'
        required: false
        default: '1'
        type: string
      MinPacketsToExchange:
        description: 'Min packets to exchange'
        required: false
        default: '1000'
        type: string
      MaxPacketsToExchange:
        description: 'Max packets to exchange'
        required: false
        default: '10000'
        type: string
      MinPacketLength:
        description: 'Min packet length (bytes)'
        required: false
        default: '100'
        type: string
      MaxPacketLength:
        description: 'Max packet length (bytes)'
        required: false
        default: '100000'
        type: string
  schedule:
    # Every Monday at 03:00 UTC — runs with 20 repetitions for better statistics
    - cron: '0 3 * * 1'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

env:
  # schedule: inputs.Repeat is empty → fallback to '20'
  # dispatch: use the provided value (default '1')
  BENCH_REPEAT:  ${{ inputs.Repeat               || '20'    }}
  BENCH_MIN_PKT: ${{ inputs.MinPacketsToExchange  || '1000'  }}
  BENCH_MAX_PKT: ${{ inputs.MaxPacketsToExchange  || '10000' }}
  BENCH_MIN_LEN: ${{ inputs.MinPacketLength       || '100'   }}
  BENCH_MAX_LEN: ${{ inputs.MaxPacketLength       || '100000' }}

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build — Windows runner, identical to build_common.yaml build_windows
  # ────────────────────────────────────────────────────────────────────────────
  build_benchmarks:
    name: Build benchmark projects
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" src\net\KNet\KNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true

      - name: Set up Java and Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create JARs
        run: mvn --file ./src/jvm/knet/pom.xml --no-transfer-progress package

      - name: Compile tests (includes benchmark projects)
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" tests\net\KNetTest.sln
        env:
          GITHUB_TEST_PREPARATION: true

      - name: Prepare configuration files
        run: |
          Copy-Item .github\workflows\support\* -Destination bin\net8.0\  -Force
          Copy-Item .github\workflows\support\* -Destination bin\net9.0\  -Force
          Copy-Item .github\workflows\support\* -Destination bin\net10.0\ -Force

      - name: Cache bin net8.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net8.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net8.0_${{ github.sha }}

      - name: Cache bin net9.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net9.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net9.0_${{ github.sha }}

      - name: Cache bin net10.0
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/net10.0/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_net10.0_${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Docker image — identical to build_common.yaml build_container_knet
  # ────────────────────────────────────────────────────────────────────────────
  build_container_knet:
    runs-on: ubuntu-latest
    outputs:
      GITHUB_REF_NAME_FOR_DOCKER: ${{ env.GITHUB_REF_NAME_FOR_DOCKER }}
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" src/net/KNet/KNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create Jars
        run: mvn --file ./src/jvm/knet/pom.xml --no-transfer-progress package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/knet

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          file: ./src/container/DockerfileKNet.linux
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest GitHub
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/knet
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Extract branch name
        run: echo "GITHUB_REF_NAME_FOR_DOCKER=$(echo ${{ github.ref_name }} | tr '/' '-')" >> $GITHUB_ENV
        shell: bash

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Run benchmarks — matrix on framework only (3 legs)
  #    Each leg runs both variants sequentially:
  #      knet     = -UseKNetProducer -UseKNetConsumer  → results/knet/
  #      standard = no extra flags (KafkaProducer/Consumer via JNI) → results/standard/
  # ────────────────────────────────────────────────────────────────────────────
  run_benchmarks:
    name: Benchmark (${{ matrix.framework }})
    needs: [build_benchmarks, build_container_knet]
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        framework: ['net8.0', 'net9.0', 'net10.0']

    services:
      kafka:
        image: ghcr.io/${{ github.repository_owner }}/knet:${{ needs.build_container_knet.outputs.GITHUB_REF_NAME_FOR_DOCKER }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 9092:9092
        env:
          KNET_DOCKER_RUNNING_MODE: server-standalone
          JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}

    env:
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}
      RESULTS_DIR: ${{ github.workspace }}/benchmark-results

    steps:
      # ── .NET SDK for this matrix leg ────────────────────────────────────────
      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net8.0'
        with:
          dotnet-version: 8.x

      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net9.0'
        with:
          dotnet-version: 9.x

      - uses: actions/setup-dotnet@v5
        if: matrix.framework == 'net10.0'
        with:
          dotnet-version: 10.x

      # ── Restore compiled binaries ────────────────────────────────────────────
      - name: Restore bin ${{ matrix.framework }} from cache
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/${{ matrix.framework }}/
          key: KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}_${{ matrix.framework }}_${{ github.sha }}

      - name: Create results directories
        run: mkdir -p "$RESULTS_DIR/knet" "$RESULTS_DIR/standard"

      # ── Robust Kafka readiness check ────────────────────────────────────────
      # nc -z only checks TCP; the broker resets connections during APIVERSION_QUERY
      # while still initialising. This script waits for a full Kafka handshake.
      - name: Wait for Kafka broker (ApiVersions handshake)
        run: |
          python3 - <<'PYEOF'
          import socket, struct, sys, time

          HOST, PORT, ATTEMPTS, DELAY = 'localhost', 9092, 40, 5
          client_id = b'readycheck'
          payload = (
              struct.pack('>hhi', 18, 0, 1) +
              struct.pack('>h', len(client_id)) + client_id
          )
          request = struct.pack('>i', len(payload)) + payload

          for attempt in range(1, ATTEMPTS + 1):
              try:
                  s = socket.create_connection((HOST, PORT), timeout=5)
                  s.sendall(request)
                  header = s.recv(4)
                  s.close()
                  if len(header) == 4:
                      print(f'Kafka broker ready (attempt {attempt})')
                      sys.exit(0)
              except Exception as exc:
                  print(f'Attempt {attempt}/{ATTEMPTS}: {exc}')
              time.sleep(DELAY)

          print('ERROR: Kafka broker not ready after timeout')
          sys.exit(1)
          PYEOF

      # Common args shared by all four benchmark invocations
      - name: Set common benchmark args
        run: |
          echo "BENCH_COMMON_ARGS=-Server localhost:9092 \
            -ShowFinalResults -ShowIntermediateResults \
            -Repeat ${{ env.BENCH_REPEAT }} \
            -MinPacketsToExchange ${{ env.BENCH_MIN_PKT }} \
            -MaxPacketsToExchange ${{ env.BENCH_MAX_PKT }} \
            -MinPacketLength ${{ env.BENCH_MIN_LEN }} \
            -MaxPacketLength ${{ env.BENCH_MAX_LEN }}" >> $GITHUB_ENV

      # ── Produce/Consume — KNet variant ───────────────────────────────────────
      # timeout(1): send SIGTERM after 25 min; if still alive, SIGKILL after 60 s.
      # This prevents a stuck consumer from blocking the entire leg.
      - name: Run KNetBenchmark [knet] [${{ matrix.framework }}]
        timeout-minutes: 30
        continue-on-error: true
        run: |
          timeout --kill-after=60 1500 \
            dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetBenchmark.dll" \
              -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml" \
              -ResultsPath "$RESULTS_DIR/knet" \
              ${{ env.BENCH_COMMON_ARGS }} \
              -UseKNetProducer -UseKNetConsumer \
          || echo "KNetBenchmark [knet] exited with $? (timeout or error — partial CSV preserved)"

      # ── Produce/Consume — Standard variant ───────────────────────────────────
      - name: Run KNetBenchmark [standard] [${{ matrix.framework }}]
        timeout-minutes: 30
        continue-on-error: true
        run: |
          timeout --kill-after=60 1500 \
            dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetBenchmark.dll" \
              -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml" \
              -ResultsPath "$RESULTS_DIR/standard" \
              ${{ env.BENCH_COMMON_ARGS }} \
          || echo "KNetBenchmark [standard] exited with $? (timeout or error — partial CSV preserved)"

      # ── Roundtrip — KNet variant ──────────────────────────────────────────────
      # -NoAcks omitted: acks=0 can silently drop messages and the consumer thread
      # would never reach numpacket, causing an infinite hang.
      - name: Run KNetRoundTripBenchmark [knet] [${{ matrix.framework }}]
        timeout-minutes: 30
        continue-on-error: true
        run: |
          timeout --kill-after=60 1500 \
            dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetRoundTripBenchmark.dll" \
              -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml" \
              -ResultsPath "$RESULTS_DIR/knet" \
              ${{ env.BENCH_COMMON_ARGS }} \
              -FetchMinBytes 1 \
              -UseKNetProducer -UseKNetConsumer \
          || echo "KNetRoundTripBenchmark [knet] exited with $? (timeout or error — partial CSV preserved)"

      # ── Roundtrip — Standard variant ──────────────────────────────────────────
      - name: Run KNetRoundTripBenchmark [standard] [${{ matrix.framework }}]
        timeout-minutes: 30
        continue-on-error: true
        run: |
          timeout --kill-after=60 1500 \
            dotnet "${{ github.workspace }}/bin/${{ matrix.framework }}/KNetRoundTripBenchmark.dll" \
              -Log4JConfiguration "${{ github.workspace }}/bin/${{ matrix.framework }}/log4j2.yaml" \
              -ResultsPath "$RESULTS_DIR/standard" \
              ${{ env.BENCH_COMMON_ARGS }} \
              -FetchMinBytes 1 \
          || echo "KNetRoundTripBenchmark [standard] exited with $? (timeout or error — partial CSV preserved)"

      # ── Upload CSVs ────────────────────────────────────────────────────────────
      # Artifact name encodes the framework; inside it contains:
      #   knet/results_*.csv  knet/roundtrip_results_*.csv
      #   standard/results_*.csv  standard/roundtrip_results_*.csv
      # The Python script derives the variant from the subdirectory name.
      - name: Upload raw benchmark results [${{ matrix.framework }}]
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-csv-${{ github.run_number }}-${{ matrix.framework }}
          path: ${{ env.RESULTS_DIR }}/
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Parse CSVs → update performance.md → open PR
  # ────────────────────────────────────────────────────────────────────────────
  update_docs:
    name: Update performance.md and open PR
    needs: run_benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      # Download all per-framework artifacts preserving directory structure.
      # Each artifact contains two subdirs produced by the same leg:
      #   ./benchmark-results/benchmark-csv-<N>-net9.0/knet/results_*.csv
      #   ./benchmark-results/benchmark-csv-<N>-net9.0/standard/results_*.csv
      # The Python script derives the variant from the subdir name.
      - name: Download all benchmark CSV results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-csv-${{ github.run_number }}-*
          path: ./benchmark-results

      - name: List downloaded CSVs (debug)
        run: find ./benchmark-results -name '*.csv' | sort

      # ── Python: parse → compute ratios → patch performance.md ────────────────
      - name: Parse results and update performance.md
        env:
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import csv, glob, math, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          RESULTS_DIR = "./benchmark-results"
          DOCS_PATH   = "src/documentation/articles/performance.md"
          RUN_ID      = os.environ.get("GITHUB_RUN_ID", "")
          RUN_NUM     = os.environ.get("GITHUB_RUN_NUMBER", "?")
          SHA_SHORT   = os.environ.get("GITHUB_SHA", "")[:7]
          REPO        = os.environ.get("GITHUB_REPOSITORY", "")
          NOW         = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          LENGTHS     = [100, 1000, 10000, 100000]

          # ── statistics ─────────────────────────────────────────────────────
          def mean(lst):
              return sum(lst) / len(lst) if lst else 0.0

          def sd(lst):
              if len(lst) < 2:
                  return None            # not enough points
              m = mean(lst)
              return math.sqrt(sum((x - m) ** 2 for x in lst) / (len(lst) - 1))

          def ratio_str(a, b):
              try:
                  return f"{a / b * 100:.2f}".replace(".", ",")
              except ZeroDivisionError:
                  return "N/A"

          def bold_if_knet_better(cell):
              try:
                  v = float(cell.split(" ")[0].replace(",", "."))
                  return f"**{cell}**" if v < 100 else cell
              except (ValueError, IndexError):
                  return cell

          def cell_str(kl, cl):
              """avg_ratio (sd_ratio) — sd shows '—' when only 1 data point."""
              avg = ratio_str(mean(kl), mean(cl))
              sk, sc = sd(kl), sd(cl)
              if sk is None or sc is None:
                  sd_part = "—"          # single measurement, no variance
              else:
                  sd_part = ratio_str(sk, sc)
              return bold_if_knet_better(f"{avg} ({sd_part})")

          # ── variant detection ───────────────────────────────────────────────
          # Path layout:
          #   benchmark-results/benchmark-csv-<N>-<fw>-<variant>/<variant>/file.csv
          def variant_from_path(path):
              m = re.search(r'[/\\](knet|standard)[/\\]', path)
              return m.group(1) if m else "unknown"

          # ── CSV parsing ─────────────────────────────────────────────────────
          def read_csv(path):
              with open(path, newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f, delimiter=";"))

          def aggregate_bench(csv_files):
              """
              CSV: NumPackets;Length;KNETProd;KNETCons;ConfluentProd;ConfluentCons
              Key: (variant, packets, length)  — framework NOT in key so that the
              3 framework legs contribute separate data points per cell, giving
              a non-zero SD even with Repeat=1.
              """
              agg = {}
              total = 0
              for path in csv_files:
                  variant = variant_from_path(path)
                  for row in read_csv(path):
                      try:
                          pkt = int(row["NumPackets"])
                          lng = int(row["Length"])
                          kp  = float(row["KNETProd"]      or 0)
                          cp  = float(row["ConfluentProd"] or 0)
                          kc  = float(row["KNETCons"]      or 0)
                          cc  = float(row["ConfluentCons"] or 0)
                          if kp == 0 and cp == 0 and kc == 0 and cc == 0:
                              print(f"  SKIP all-zeros: {path} pkt={pkt} len={lng}")
                              continue
                          key = (variant, pkt, lng)
                          d = agg.setdefault(key, {"kp":[],"cp":[],"kc":[],"cc":[]})
                          if kp > 0: d["kp"].append(kp)
                          if cp > 0: d["cp"].append(cp)
                          if kc > 0: d["kc"].append(kc)
                          if cc > 0: d["cc"].append(cc)
                          total += 1
                      except (KeyError, ValueError) as e:
                          print(f"  PARSE ERROR {path}: {e} | row={row}")
              print(f"aggregate_bench: {total} rows from {len(csv_files)} file(s)")
              return agg

          def aggregate_roundtrip(csv_files):
              """
              CSV: NumPackets;Length;KNETMax;KNETMin;KNETMean;ConfluentMax;ConfluentMin;ConfluentMean
              Key: (variant, packets, length)
              """
              agg = {}
              total = 0
              for path in csv_files:
                  variant = variant_from_path(path)
                  for row in read_csv(path):
                      try:
                          pkt = int(row["NumPackets"])
                          lng = int(row["Length"])
                          km  = float(row["KNETMean"]      or 0)
                          cm  = float(row["ConfluentMean"] or 0)
                          if km == 0 and cm == 0:
                              print(f"  SKIP all-zeros: {path} pkt={pkt} len={lng}")
                              continue
                          key = (variant, pkt, lng)
                          d = agg.setdefault(key, {"km":[],"cm":[]})
                          if km > 0: d["km"].append(km)
                          if cm > 0: d["cm"].append(cm)
                          total += 1
                      except (KeyError, ValueError) as e:
                          print(f"  PARSE ERROR {path}: {e} | row={row}")
              print(f"aggregate_roundtrip: {total} rows from {len(csv_files)} file(s)")
              return agg

          # ── table builder ───────────────────────────────────────────────────
          # Preserves the original format: rows=packets, columns=lengths.
          HEADER = (
              "|  | 100 bytes | 1 000 bytes | 10 000 bytes | 100 000 bytes |\n"
              "|:---:\t|:---:\t|:---:\t|:---:\t|:---:\t|\n"
          )

          def build_single_table(agg, variant, k_key, c_key):
              packets_list = sorted({k[1] for k in agg if k[0] == variant})
              if not packets_list:
                  return "_No data._\n"
              rows = ""
              for packets in packets_list:
                  cols = []
                  for length in LENGTHS:
                      d  = agg.get((variant, packets, length), {})
                      kl = d.get(k_key, [])
                      cl = d.get(c_key, [])
                      cols.append(cell_str(kl, cl) if kl and cl else "N/A")
                  rows += f"| {packets:,} messages | " + " | ".join(cols) + " |\n"
              return HEADER + rows

          def build_two_variant_block(agg, k_key, c_key,
                                       knet_label, std_label):
              """Generate a block with two sub-tables: KNet variant then Standard."""
              knet_table = build_single_table(agg, "knet",     k_key, c_key)
              std_table  = build_single_table(agg, "standard", k_key, c_key)
              return (
                  f"\n_Using **KNetProducer** and **KNetConsumer**_ (`{knet_label}`):\n\n"
                  f"{knet_table}\n"
                  f"_Using **KafkaProducer** and **KafkaConsumer**_ ({std_label}):\n\n"
                  f"{std_table}"
              )

          # ── load data ───────────────────────────────────────────────────────
          bench_csvs     = sorted(glob.glob(f"{RESULTS_DIR}/**/results_*.csv",           recursive=True))
          roundtrip_csvs = sorted(glob.glob(f"{RESULTS_DIR}/**/roundtrip_results_*.csv", recursive=True))

          print(f"Found {len(bench_csvs)} bench CSV(s), {len(roundtrip_csvs)} roundtrip CSV(s)")

          if not bench_csvs and not roundtrip_csvs:
              print("No CSV files found – skipping doc update.")
              exit(0)

          bench_agg     = aggregate_bench(bench_csvs)
          roundtrip_agg = aggregate_roundtrip(roundtrip_csvs)

          if not bench_agg and not roundtrip_agg:
              print("All CSVs contain only failed rows – skipping doc update.")
              exit(0)

          run_badge = (
              f"\n> Results automatically updated by CI run "
              f"[#{RUN_NUM}](https://github.com/{REPO}/actions/runs/{RUN_ID})"
              f" · commit `{SHA_SHORT}` · {NOW}\n"
          )

          # Build the content blocks that will replace each section
          produce_block   = build_two_variant_block(
              bench_agg, "kp", "cp",
              "-UseKNetProducer -UseKNetConsumer",
              "standard JNI wrappers"
          )
          consume_block   = build_two_variant_block(
              bench_agg, "kc", "cc",
              "-UseKNetProducer -UseKNetConsumer",
              "standard JNI wrappers"
          )
          roundtrip_block = build_two_variant_block(
              roundtrip_agg, "km", "cm",
              "-UseKNetProducer -UseKNetConsumer",
              "standard JNI wrappers"
          )

          # ── patch performance.md ─────────────────────────────────────────────
          doc = Path(DOCS_PATH).read_text(encoding="utf-8")

          def replace_block(doc, start_marker, end_marker, new_content, badge):
              """
              Replace everything BETWEEN start_marker and end_marker.
              Both markers are preserved in the output.

              BUG FIX: the Produce section uses CONSUME_MARKER as its end so
              that CONSUME_MARKER is not swallowed, and the Consume section uses
              '#### Analysis' as its end.  Using '#### Analysis' as the end for
              both would make the first substitution consume the entire
              Produce+Consume block, deleting CONSUME_MARKER and leaving the
              Consume table empty on every run.
              """
              pattern = re.compile(
                  rf"({re.escape(start_marker)})(.*?)({re.escape(end_marker)})",
                  re.DOTALL,
              )
              def make_repl(m):
                  return (
                      m.group(1)      # start_marker preserved
                      + "\n\n"
                      + new_content
                      + "\n"
                      + badge
                      + "\n"
                      + m.group(3)    # end_marker preserved
                  )
              result, n = pattern.subn(make_repl, doc)
              if n == 0:
                  print(f"WARNING: marker not found — {start_marker!r}")
              return result

          # Markers exactly as they appear in the doc
          PRODUCE_MARKER   = "- KNet/Confluent.Kafka™ Produce Average ratio percentage (SD ratio percentage):"
          CONSUME_MARKER   = "- KNet/Confluent.Kafka™ Consume Average ratio percentage (SD ratio percentage):"
          ROUNDTRIP_MARKER = "- KNet/Confluent.Kafka™ Roundtrip Average ratio percentage (SD ratio percentage):"
          ANALYSIS         = "#### Analysis"

          # Order matters: Produce uses CONSUME_MARKER as end (preserves it);
          # Consume and Roundtrip both use ANALYSIS as end (two separate occurrences).
          doc = replace_block(doc, PRODUCE_MARKER,   CONSUME_MARKER, produce_block,   run_badge)
          doc = replace_block(doc, CONSUME_MARKER,   ANALYSIS,       consume_block,   run_badge)
          doc = replace_block(doc, ROUNDTRIP_MARKER, ANALYSIS,       roundtrip_block, run_badge)

          Path(DOCS_PATH).write_text(doc, encoding="utf-8")
          print("performance.md updated successfully.")
          PYEOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: perf/benchmark-results-${{ github.run_number }}
          base: master
          commit-message: "perf: update benchmark results [run #${{ github.run_number }}]"
          title: "perf: update benchmark results [run #${{ github.run_number }}]"
          body: |
            ## :bar_chart: Automated benchmark results update

            This PR updates the performance tables in
            `src/documentation/articles/performance.md`
            with the latest benchmark run results.

            Each table shows two sub-sections:
            - **KNetProducer / KNetConsumer** (`-UseKNetProducer -UseKNetConsumer`)
            - **KafkaProducer / KafkaConsumer** (standard JNI wrappers)

            | | |
            |---|---|
            | **CI run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Commit** | `${{ github.sha }}` |
            | **Trigger** | `${{ github.event_name }}` |
            | **Frameworks** | `net8.0` / `net9.0` / `net10.0` (knet + standard per leg) |
            | **Repetitions** | `${{ env.BENCH_REPEAT }}` |
            | **Packets** | `${{ env.BENCH_MIN_PKT }}` → `${{ env.BENCH_MAX_PKT }}` |
            | **Lengths (bytes)** | `${{ env.BENCH_MIN_LEN }}` → `${{ env.BENCH_MAX_LEN }}` |

            Raw CSV results are attached as workflow artifacts (retained 90 days).

            > [!NOTE]
            > Please review the updated tables before merging.
          labels: |
            documentation
            performance
          add-paths: src/documentation/articles/performance.md

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Cleanup — mirrors final_cleanup in build_common.yaml
  # ────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Clear build caches
    needs: [run_benchmarks, update_docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'

      - name: Delete KNetBenchmark caches for this run
        run: |
          gh extension install actions/gh-actions-cache
          KEYS=$(gh actions-cache list \
            --key "KNetBenchmark_${{ github.run_number }}_${{ github.run_attempt }}" \
            | cut -f 1)
          set +e
          for KEY in $KEYS; do
            gh actions-cache delete "$KEY" --confirm
          done
          echo "Done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
