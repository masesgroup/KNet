# Apache Kafka Connect common

name=local-knet-source
connector.class=KNetSourceConnector
tasks.max=1
topic=topic-perf

# KNet Connect SDK common

# uncomment to set the path of JCOBridge license 
#knet.jcobridge.license.path=
# uncomment to set the Scoped On value of JCOBridge license 
#knet.jcobridge.scope.on=
# uncomment to set the Scoped On Version value of JCOBridge license 
#knet.jcobridge.scope.on.version=
# uncomment to set the CLR version to be used from JCOBridge: values are 8, 9, 10 for .NET, to use .NET Framework leave the field empty
#knet.jcobridge.clr.version=
# uncomment to set the CLR RID to be used from JCOBridge: by default it is automatically evaluated
#knet.jcobridge.clr.rid=
# uncomment to set the location of the assembly to be loaded containing the .NET class set in knet.dotnet.classname
#knet.dotnet.assembly.location=
# the .NET class to be loaded in the form of fully qualified class name
knet.dotnet.classname=MASES.KNet.Template.KNetConnect.KNetConnectSource, knetConnectSource

# KNet Connect SDK Source Connector

# enable following line if Connect state machine invokes exactlyOnceSupport method before infrastructure is ready to receive request in .NET side
#knet.dotnet.source.exactlyOnceSupport=true
# enable following line if Connect state machine invokes canDefineTransactionBoundaries method before infrastructure is ready to receive request in .NET side
#knet.dotnet.source.canDefineTransactionBoundaries=true
